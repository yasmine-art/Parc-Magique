<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Historique des Tickets - Parc Magique</title>
    <script src="https://cdn.rawgit.com/davidshimjs/qrcodejs/gh-pages/qrcode.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .attraction-info {
            margin-top: 15px;
            padding-top: 10px;
            border-top: 1px dashed #ddd;
        }

        .attraction-info h4 {
            color: #b36572;
            margin-bottom: 10px;
            font-size: 1.1rem;
        }

        .attraction-info p {
            margin: 8px 0;
            padding: 5px;
            background: #f9f9f9;
            border-radius: 4px;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: mistyrose;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
        }

        .home-button {
            position: fixed;
            top: 8px;
            left: 20px;
            padding: 10px 20px;
            background: linear-gradient(135deg, #b36572, rgb(242,192,175));
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-size: 14px;
            font-weight: bold;
            transition: all 0.3s ease;
            z-index: 1000;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .home-button:hover {
            transform: translateY(-5px) scale(1.1);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
            background: linear-gradient(135deg, rgb(242,192,175), #b36572);
        }

        .history-container {
            max-width: 1200px;
            padding: 0px;
        }

        .history-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .history-title {
            color: #b36572;
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        .filters {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 8px 15px;
            background-color: #f8f9fa;
            border: 1px solid #ddd;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .filter-btn.active {
            background-color: #b36572;
            color: white;
            border-color: #b36572;
        }

        .search-bar {
            margin: 20px auto;
            max-width: 500px;
        }

        .search-bar input {
            width: 100%;
            padding: 10px 15px;
            border: 1px solid #ddd;
            border-radius: 25px;
            font-size: 16px;
        }

        .tickets-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }

        .ticket-card {
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            padding: 20px;
            transition: transform 0.3s;
            position: relative;
            overflow: hidden;
        }

        .ticket-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.15);
        }

        .ticket-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid #eee;
        }

        .ticket-park {
            font-size: 1.3rem;
            color: #b36572;
            font-weight: bold;
        }

        .status-badge {
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            text-transform: uppercase;
        }

        .status-upcoming {
            background: #4CAF50;
            color: white;
        }

        .status-used {
            background: #2196F3;
            color: white;
        }

        .ticket-body p {
            margin: 8px 0;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .ticket-body i {
            width: 20px;
            color: #b36572;
        }

        .ticket-actions {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px solid #eee;
        }

        .view-btn {
            padding: 8px 15px;
            background: #b36572;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: bold;
        }

        .view-btn:hover {
            background: #9a5460;
        }

        /* Style ajouté pour le bouton de suppression */
        .delete-btn {
            padding: 8px 15px;
            background: #f44336;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: bold;
        }

        .delete-btn:hover {
            background: #d32f2f;
        }

        .no-tickets {
            text-align: center;
            padding: 40px;
            font-size: 1.2rem;
            color: #666;
        }

        .stats-container {
            background: white;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 30px;
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
            gap: 15px;
        }

        .stat-card {
            text-align: center;
            padding: 15px;
            min-width: 150px;
        }

        .stat-value {
            font-size: 2rem;
            font-weight: bold;
            color: #b36572;
            margin: 5px 0;
        }

        .stat-label {
            color: #666;
            font-size: 0.9rem;
        }

        .ticket-body p strong {
            color: #b36572;
        }

        @media (max-width: 768px) {
            .tickets-grid {
                grid-template-columns: 1fr;
            }
            
            .history-title {
                font-size: 2rem;
            }
            
            .filters {
                flex-direction: column;
                align-items: center;
            }
        }
    
        .ticket-content {
            display: flex;
            gap: 20px;
        }

        .ticket-body {
            flex: 1;
        }

        .ticket-qr {
            width: 120px;
            height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: white;
            padding: 5px;
            border: 1px solid #eee;
            border-radius: 5px;
        }

        @media (max-width: 600px) {
            .ticket-content {
                flex-direction: column;
            }
            
            .ticket-qr {
                align-self: center;
            }
        }

        /* Styles ajoutés pour le modal de suppression */
        .modal {
            display: none;
            position: fixed;
            z-index: 1001;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
        }

        .modal-content {
            background-color: #fefefe;
            margin: 15% auto;
            padding: 20px;
            border-radius: 10px;
            width: 80%;
            max-width: 400px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 20px;
        }

        .modal-btn {
            padding: 8px 16px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .modal-btn.confirm {
            background-color: #f44336;
            color: white;
        }

        .modal-btn.cancel {
            background-color: #ccc;
        }
    </style>
</head>
<body>
    <a href="exple.html" class="home-button">
        <i class="fas fa-home"></i>Accueil 
    </a>

    <!-- Modal de confirmation de suppression ajouté -->
    <div id="deleteModal" class="modal">
        <div class="modal-content">
            <h3>Confirmer la suppression</h3>
            <p>Êtes-vous sûr de vouloir supprimer ce ticket ? Cette action est irréversible.</p>
            <div class="modal-actions">
                <button class="modal-btn cancel" id="cancelDelete">Annuler</button>
                <button class="modal-btn confirm" id="confirmDelete">Supprimer</button>
            </div>
        </div>
    </div>

    <div class="history-container">
        <div class="history-header">
            <h1 class="history-title">Votre Historique de Tickets</h1>
            <p>Retrouvez ici tous vos tickets pour le Parc Magique</p>
        </div>

        <div class="stats-container">
            <div class="stat-card">
                <div class="stat-value" id="total-tickets">0</div>
                <div class="stat-label">Total des tickets</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="upcoming-tickets">0</div>
                <div class="stat-label">Non consommé</div>
            </div>
        </div>

        <div class="filters">
            <button class="filter-btn active" data-filter="all">Tous</button>
            <button class="filter-btn" data-filter="upcoming">Non consommé</button>
            <button class="filter-btn" data-filter="used">Utilisés</button> 
        </div>

        <div class="search-bar">
            <input type="text" id="search-input" placeholder="Rechercher par référence ou nom de parc...">
        </div>

        <div class="tickets-grid" id="tickets-container">
            <!-- Les tickets seront ajoutés ici par JavaScript -->
        </div>
    </div>

    <script>
document.addEventListener("DOMContentLoaded", function() {
    const userData = JSON.parse(localStorage.getItem('userData'));
    if (!userData || !userData.id) {
        alert('Veuillez vous connecter pour accéder à votre historique');
        window.location.href = 'login.html';
        return;
    }

    const ticketsContainer = document.getElementById('tickets-container');
    const totalTicketsEl = document.getElementById('total-tickets');
    const upcomingTicketsEl = document.getElementById('upcoming-tickets');
    const filterBtns = document.querySelectorAll('.filter-btn');
    const searchInput = document.getElementById('search-input');
    
    // Éléments pour la suppression
    const deleteModal = document.getElementById('deleteModal');
    const cancelDeleteBtn = document.getElementById('cancelDelete');
    const confirmDeleteBtn = document.getElementById('confirmDelete');
    let ticketToDelete = null;

    let tickets = [];
    let filteredTickets = [];

    function loadTickets() {
        fetch('tickets.php', {
            method: 'GET',
            credentials: 'include'
        })
        .then(response => {
            if (!response.ok) throw new Error('Erreur réseau');
            return response.json();
        })
        .then(data => {
            if (data.success) {
                tickets = processTickets(data.tickets);
                updateStats();
                displayTickets();
            } else {
                showError(data.message || "Erreur lors du chargement des tickets");
            }
        })
        .catch(error => {
            showError("Erreur de connexion au serveur");
            console.error('Error:', error);
        });
    }

    function processTickets(ticketsData) {
        const today = new Date();
        today.setHours(0, 0, 0, 0);

        return ticketsData.map(ticket => {
            if (ticket.status === 'cancelled') return ticket;

            const visitDate = new Date(ticket.visitDate);
            visitDate.setHours(0, 0, 0, 0);

            return {
                ...ticket,
                status: visitDate > today ? 'upcoming' : 'used'
            };
        });
    }

    function updateStats() {
        const total = tickets.length;
        const upcoming = tickets.filter(t => t.status === 'upcoming').length;
        
        totalTicketsEl.textContent = total;
        upcomingTicketsEl.textContent = upcoming;
    }

    function displayTickets(filter = 'all', searchTerm = '') {
        ticketsContainer.innerHTML = '';
        
        if (tickets.length === 0) {
            ticketsContainer.innerHTML = '<div class="no-tickets">Vous n\'avez aucun ticket dans votre historique.</div>';
            return;
        }
        
        filteredTickets = tickets.filter(ticket => {
            const matchesFilter = filter === 'all' || ticket.status === filter;
            const matchesSearch = searchTerm === '' || 
                (ticket.park_title && ticket.park_title.toLowerCase().includes(searchTerm.toLowerCase())) || 
                (ticket.id && ticket.id.toString().toLowerCase().includes(searchTerm.toLowerCase()));
            return matchesFilter && matchesSearch;
        });
        
        if (filteredTickets.length === 0) {
            ticketsContainer.innerHTML = '<div class="no-tickets">Aucun ticket ne correspond à votre recherche.</div>';
            return;
        }
        
        filteredTickets.forEach(ticket => {
            const ticketEl = createTicketElement(ticket);
            ticketsContainer.appendChild(ticketEl);
            
            setTimeout(() => {
                let qrData = {
                    attractions: []
                };

                if (ticket.attractions && ticket.attractions.length > 0) {
                    qrData.attractions = ticket.attractions.map(att => ({
                        nom: att.nom_attraction,
                        prix: att.prix_attraction,
                        quantite: att.quantite,
                        total: (att.prix_attraction * att.quantite).toFixed(2)
                    }));
                } else {
                    qrData.attractions.push({
                        nom: ticket.nom_attraction,
                        prix: ticket.prix_attraction,
                        quantite: ticket.quantite,
                        total: (ticket.prix_attraction * ticket.quantite).toFixed(2)
                    });
                }
                
                new QRCode(document.getElementById(`qr-${ticket.id}`), {
                    text: JSON.stringify(qrData, null, 2),
                    width: 110,
                    height: 110,
                    colorDark: "#b36572",
                    colorLight: "#ffffff",
                    correctLevel: QRCode.CorrectLevel.H
                });
            }, 100);
        });
    }

    function createTicketElement(ticket) {
        const ticketEl = document.createElement('div');
        ticketEl.className = 'ticket-card';
        
        const { statusText, statusClass } = getStatusInfo(ticket.status);
        
        let qrData = {
            reference: ticket.id,
            parc: ticket.park_title,
            client: ticket.name,
            email: ticket.email,
            date_visite: ticket.visitDate,
            statut: ticket.statut,
            attractions: []
        };

        if (ticket.attractions && ticket.attractions.length > 0) {
            qrData.attractions = ticket.attractions.map(att => ({
                nom: att.nom_attraction,
                prix: att.prix_attraction,
                quantite: att.quantite,
                total: (att.prix_attraction * att.quantite).toFixed(2)
            }));
        } else {
            qrData.attractions.push({
                nom: ticket.nom_attraction,
                prix: ticket.prix_attraction,
                quantite: ticket.quantite,
                total: (ticket.prix_attraction * ticket.quantite).toFixed(2)
            });
        }
        
        qrData.total_general = ticket.total.toFixed(2);

        const qrDataString = JSON.stringify(qrData, null, 2);
        
        ticketEl.innerHTML = `
            <div class="ticket-header">
                <div class="ticket-park">${ticket.park_title}</div>
                <span class="status-badge ${statusClass}">${statusText}</span>
            </div>
            <div class="ticket-content">
                <div class="ticket-body">
                    <p><strong> Référence: </strong>${ticket.id}</p>
                    <p><strong> Nom: </strong> ${ticket.name}</p>
                    <p><strong>Email: </strong> ${ticket.email}</p>
                    <p><strong>Date de visite: </strong> ${formatDate(ticket.visitDate)}</p>
                    <p><strong> Prix: </strong> ${ticket.total.toFixed(2)} DA</p>
                    <p><strong> Statut: </strong>${ticket.statut}</p>
                </div>
                <div class="ticket-qr" id="qr-${ticket.id}"></div>
            </div>
            <div class="ticket-actions">
                ${ticket.status === 'used' ? 
                    `<button class="delete-btn" data-ticket-id="${ticket.id}">
                        <i class="fas fa-trash"></i> Supprimer
                    </button>` : 
                    ''
                }
            </div>
        `;
        
        // Ajout de l'événement de suppression
        const deleteBtn = ticketEl.querySelector('.delete-btn');
        if (deleteBtn) {
            deleteBtn.addEventListener('click', function(e) {
                e.stopPropagation();
                ticketToDelete = ticket.id;
                deleteModal.style.display = 'block';
            });
        }
        
        return ticketEl;
    }

    function getStatusInfo(status) {
        switch(status) {
            case 'upcoming':
                return { statusText: 'Non consommé', statusClass: 'status-upcoming' };
            case 'used':
                return { statusText: 'UTILISÉ', statusClass: 'status-used' };
            case 'cancelled':
                return { statusText: 'ANNULÉ', statusClass: 'status-cancelled' };
            default:
                return { statusText: status.toUpperCase(), statusClass: 'status-upcoming' };
        }
    }

    function formatDate(dateString) {
        const options = { year: 'numeric', month: 'long', day: 'numeric' };
        return new Date(dateString).toLocaleDateString('fr-FR', options);
    }

    function showError(message) {
        ticketsContainer.innerHTML = `
            <div class="no-tickets error">
                <i class="fas fa-exclamation-triangle"></i>
                <p>${message}</p>
                <button onclick="loadTickets()">Réessayer</button>
            </div>
        `;
    }

    // Fonction pour supprimer un ticket
    function deleteTicket(ticketId) {
    fetch('tickets.php', {
        method: 'DELETE',
        headers: {
            'Content-Type': 'application/json',
        },
        body: JSON.stringify({ ticket_id: ticketId })
    })
    .then(response => response.json())
    .then(data => {
        if (data.success) {
            // Mettre à jour l'interface utilisateur
            tickets = tickets.filter(ticket => ticket.id !== ticketId);
            updateStats();
            
            const activeFilter = document.querySelector('.filter-btn.active').dataset.filter;
            const searchTerm = searchInput.value.trim();
            displayTickets(activeFilter, searchTerm);
        } else {
            alert('Erreur lors de la suppression: ' + (data.message || 'Erreur inconnue'));
        }
    })
    .catch(error => {
        console.error('Error:', error);
        alert('Erreur de connexion au serveur');
    });
}

    // Gestion des événements
    filterBtns.forEach(btn => {
        btn.addEventListener('click', function() {
            filterBtns.forEach(b => b.classList.remove('active'));
            this.classList.add('active');
            displayTickets(this.dataset.filter, searchInput.value.toLowerCase());
        });
    });

    let searchTimeout;
    searchInput.addEventListener('input', function() {
        clearTimeout(searchTimeout);
        const searchValue = this.value.trim();
        
        searchTimeout = setTimeout(() => {
            const activeFilter = document.querySelector('.filter-btn.active').dataset.filter;
            displayTickets(activeFilter, searchValue);
        }, 300);
    });

    // Gestion du modal de suppression
    cancelDeleteBtn.addEventListener('click', function() {
        deleteModal.style.display = 'none';
        ticketToDelete = null;
    });

    confirmDeleteBtn.addEventListener('click', function() {
        if (ticketToDelete) {
            deleteTicket(ticketToDelete);
            deleteModal.style.display = 'none';
            ticketToDelete = null;
        }
    });

    window.addEventListener('click', function(event) {
        if (event.target === deleteModal) {
            deleteModal.style.display = 'none';
            ticketToDelete = null;
        }
    });

    // Initialisation
    loadTickets();
});

function viewTicket(ticketId) {
    const ticketsHistory = JSON.parse(localStorage.getItem('ticketsHistory')) || [];
    const ticket = ticketsHistory.find(t => t.id === ticketId);
    
    if (!ticket) {
        alert('Ticket non trouvé');
        return;
    }
    
    const panier = {
        name: ticket.nom,
        price: ticket.prix,
        quantity: ticket.quantity,
        date: ticket.visitDate,
        total: ticket.total,
        ticketId: ticket.id || Date.now()
    };

    localStorage.setItem('panier', JSON.stringify(panier));
    localStorage.setItem('ticketInfo', JSON.stringify({
        nom: ticket.name,
        telephone: ticket.phone,
        email: ticket.email,
        dateVisite: ticket.visitDate,
        total: ticket.total,
        statusPaiement: ticket.status === 'cancelled' ? 'Annulé' : 'Payé'
    }));
    localStorage.setItem('parkTitle', ticket.parkName);
    
    window.open('ticket.html', '_blank');
}
    </script>
</body>
</html>
