<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paiement - Parc Magique</title>
    <link rel="stylesheet" href="payment.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="icon" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/svgs/solid/star.svg" type="image/svg+xml">
</head>
<body>
    <main class="payment-container">
        <section class="payment-image">
            <img src="images/-aTIrI2Ogoz2Az7kTL7iD.jpg" alt="Paiement Parc Magique">
        </section>
        <section class="form-section">
            <h2>Paiement</h2>
            <h2 id="total-display">Chargement du total...</h2>
            <form id="payment-form">
                <div class="form-group">
                    <label for="nom">Nom complet :</label>
                    <div class="input-container">
                        <i class="fas fa-user"></i>
                        <input type="text" id="nom" name="nom" required placeholder="Votre nom complet">
                    </div>
                </div>
                <div class="form-group">
                    <label for="email">Email :</label>
                    <div class="input-container">
                        <i class="fas fa-envelope"></i>
                        <input type="email" id="email" name="email" required placeholder="Votre adresse email">
                    </div>
                </div>
              
                <div class="form-group">
                    <label for="date-visite">Date de visite :</label>
                    <div class="input-container">
                        <i class="fas fa-calendar-alt"></i>
                        <input type="date" id="date-visite" name="date-visite" placeholder="entrer la date" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>Choisissez votre mode de paiement :</label>
                    <div style="display: flex; gap: 10px;">
                        <label>
                            <input type="checkbox" id="paiement-en-ligne"> Paiement en ligne
                        </label>
                        <label>
                            <input type="checkbox" id="paiement-espece"> Paiement en espèces
                        </label>
                    </div>
                </div>

                <div class="form-group" id="card-info" style="display: none;">
                    <label for="card-number">Numéro de carte :</label>
                    <div class="input-container">
                        <i class="fas fa-credit-card"></i>
                        <input type="text" id="card-number" name="card-number" placeholder="Numéro de carte">
                    </div>
                </div>

                <button type="submit">Payer</button>
            </form>
        </section>
    </main>

    <script>
       document.addEventListener("DOMContentLoaded", function () {
       
    // Récupérer les infos utilisateur depuis le localStorage
    const userData = JSON.parse(localStorage.getItem('userData'));
    const panier = JSON.parse(localStorage.getItem('panier')) || [];
    const totalPanier = localStorage.getItem('totalPanier');

    // Afficher le total
    if (totalPanier) {
        document.getElementById('total-display').textContent = `Total à payer : ${totalPanier} DA`;
    } else {
        document.getElementById('total-display').textContent = "Erreur : Aucun montant trouvé.";
    }

    // Pré-remplir les champs si l'utilisateur est connecté
    if (userData) {
        document.getElementById('nom').value = userData.nom ;
        if (userData.email) {
            document.getElementById('email').value = userData.email;
        }
    }

    // Gestion de l'affichage des options de paiement
    document.getElementById('paiement-en-ligne').addEventListener('change', function () {
        const cardInfo = document.getElementById('card-info');
        if (this.checked) {
            cardInfo.style.display = 'block';
            document.getElementById('card-number').setAttribute('required', 'true');
            document.getElementById('paiement-espece').checked = false;
        } else {
            cardInfo.style.display = 'none';
            document.getElementById('card-number').removeAttribute('required');
        }
    });

    document.getElementById('paiement-espece').addEventListener('change', function () {
        if (this.checked) {
            document.getElementById('paiement-en-ligne').checked = false;
            document.getElementById('card-info').style.display = 'none';
            document.getElementById('card-number').removeAttribute('required');
        }
    });

    // Validation de la date (au moins aujourd'hui)
    const dateInput = document.getElementById('date-visite');
    const today = new Date().toISOString().split('T')[0];
    dateInput.setAttribute('min', today);

    // Gestion de la soumission du formulaire
    document.getElementById('payment-form').addEventListener('submit', async function (event) {
        event.preventDefault();

        // Afficher un indicateur de chargement
        const submitButton = this.querySelector('button[type="submit"]');
        const originalButtonText = submitButton.textContent;
        submitButton.textContent = 'Traitement en cours...';
        submitButton.disabled = true;

        try {
            // Récupérer les données du formulaire
            const nom = document.getElementById('nom').value;
            const email = document.getElementById('email').value;
            const dateVisite = document.getElementById('date-visite').value;
            const paiementEnLigne = document.getElementById('paiement-en-ligne').checked;
            const modePaiement = paiementEnLigne ? "en_ligne" : "espece";
            const numeroCarte = paiementEnLigne ? document.getElementById('card-number').value : null;
            const parkTitle = localStorage.getItem('parkTitle') ;
            // Validation simple
            if (!dateVisite) {
                throw new Error("Veuillez choisir une date de visite.");
            }

            if (paiementEnLigne && (!numeroCarte || !/^\d{16,}$/.test(numeroCarte))) {
                throw new Error("Veuillez entrer un numéro de carte valide (16 chiffres minimum).");
            }

            // Préparer les données à envoyer
            const paymentData = {
                nom_complet: nom,
                email: email,
                date_visite: dateVisite,
                montant: totalPanier,
                mode_paiement: modePaiement,
                numero_carte: numeroCarte,
                panier: panier,   
                park_title: parkTitle
            };

            // Envoyer les données au serveur
            const response = await fetch('process_payment.php', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(paymentData)
            });

            const data = await response.json();

            if (!data.success) {
                throw new Error(data.message || "Erreur lors du traitement du paiement");
            }

            // Stocker les infos pour le ticket
            localStorage.setItem('ticketInfo', JSON.stringify({
                nom: data.data.nom,
                email: data.data.email,
                dateVisite: data.data.date_visite,
                total: totalPanier,
                panier: panier,
                statusPaiement: paiementEnLigne ? "Payé" : "À payer",
                modePaiement: data.data.mode_paiement,
                reference: data.reference,
                last4Digits: numeroCarte ? numeroCarte.slice(-4) : null,
                attractions_ids: data.attractions_ids || []
            }));

            // Rediriger vers la page de ticket
          /* window.location.href = 'ticket.html';*/
          window.location.href = `ticket.html?id=${data.ticket_id}`;
           

        } catch (error) {
            // Afficher l'erreur
            alert(error.message);
            console.error("Erreur:", error);
            
            // Réactiver le bouton
            submitButton.textContent = originalButtonText;
            submitButton.disabled = false;
        }
    });
});
    </script>
</body>
</html>
