<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - Parc Magique</title>
    <link rel="stylesheet" href="login.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet">
    <link rel="icon" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/svgs/solid/star.svg" type="image/svg+xml">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <a href="exple.html" class="home-button">
        <i class="fas fa-home"></i> 
    </a>
    <main class="login-container">
        <!-- Section Image -->
        <section class="login-image">
            <img src="images/parc1.jpg" alt="Parc Magique">
        </section>
        <!-- Section Formulaire -->
        <section class="login-form">
            <h1> Connexion</h1>
            <form action="login.php" method="POST" class="auth-form">
                <div class="form-group">
                    <label for="email"><i class="fas fa-envelope"></i> Email :</label>
                    <input type="email" id="email" name="email" placeholder="Entrez votre email" required>
                </div>
                <div class="form-group">
                    <label for="pass"><i class="fas fa-lock"></i> Mot de passe :</label>
                    <input type="password" id="pass" name="pass" placeholder="Entrez votre mot de passe" required>
                </div>
                <button type="submit" class="btn-submit"> Se connecter</button>
            </form>
            <p>Pas encore inscrit ? <a href="register.html">Créer un compte</a></p>
        </section>
    </main>
    <script>
    document.addEventListener("DOMContentLoaded", function () {
    const form = document.querySelector(".auth-form");
    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("pass");

    form.addEventListener("submit", function (event) {
        if (!emailInput.value.trim() || !passwordInput.value.trim()) {
            alert("Veuillez remplir tous les champs.");
            event.preventDefault();
            return;
        }

        if (!validateEmail(emailInput.value)) {
            alert("Veuillez entrer une adresse email valide.");
            event.preventDefault();
            return;
        }
        
        if (passwordInput.value.length < 6) {
            alert("Le mot de passe doit contenir au moins 6 caractères.");
            event.preventDefault();
            return;
        }
    });

    function validateEmail(email) {
        const re = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        return re.test(email);
    }

    // Ajouter une icône pour afficher/masquer le mot de passe dans le champ input
    const passwordWrapper = document.createElement("div");
    passwordWrapper.style.position = "relative";

    passwordInput.parentNode.insertBefore(passwordWrapper, passwordInput);
    passwordWrapper.appendChild(passwordInput);

    const togglePassword = document.createElement("span");
    togglePassword.innerHTML = '<i class="fas fa-eye"></i>';
    togglePassword.style.position = "absolute";
    togglePassword.style.right = "10px";
    togglePassword.style.top = "50%";
    togglePassword.style.transform = "translateY(-50%)";
    togglePassword.style.cursor = "pointer";

    passwordWrapper.appendChild(togglePassword);

    togglePassword.addEventListener("click", function () {
        if (passwordInput.type === "password") {
            passwordInput.type = "text";
            togglePassword.innerHTML = '<i class="fas fa-eye-slash"></i>';
        } else {
            passwordInput.type = "password";
            togglePassword.innerHTML = '<i class="fas fa-eye"></i>';
        }
    });
});
    </script>
</body>
</html>
