<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Détail du Ticket</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f8f9fa;
            margin: 0;
            padding: 20px;
        }
        .ticket-detail-container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 3px 15px rgba(0,0,0,0.1);
        }
        .ticket-header {
            text-align: center;
            margin-bottom: 30px;
            border-bottom: 2px solid #eee;
            padding-bottom: 20px;
        }
        .ticket-title {
            color: #b36572;
            margin-bottom: 5px;
        }
        .ticket-ref {
            font-size: 1.2rem;
            font-weight: bold;
            color: #555;
        }
        .ticket-body {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-bottom: 30px;
        }
        .ticket-section {
            margin-bottom: 20px;
        }
        .section-title {
            color: #b36572;
            border-bottom: 1px solid #eee;
            padding-bottom: 5px;
            margin-bottom: 15px;
        }
        .detail-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
        }
        .detail-label {
            font-weight: bold;
            color: #666;
        }
        .detail-value {
            text-align: right;
        }
        .attractions-list {
            list-style-type: none;
            padding: 0;
        }
        .attraction-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px dashed #eee;
        }
        .ticket-footer {
            text-align: center;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 2px solid #eee;
            color: #666;
        }
        .action-buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 30px;
        }
        .btn {
            padding: 10px 20px;
            border-radius: 5px;
            border: none;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.3s;
        }
        .btn-primary {
            background-color: #b36572;
            color: white;
        }
        .btn-primary:hover {
            background-color: #9a5460;
        }
        .btn-secondary {
            background-color: #6c757d;
            color: white;
        }
        .btn-secondary:hover {
            background-color: #5a6268;
        }
        @media (max-width: 768px) {
            .ticket-body {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="ticket-detail-container" id="ticket-detail">
        <!-- Le contenu sera généré par JavaScript -->
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const ticketId = localStorage.getItem('currentTicketId');
            const tickets = JSON.parse(localStorage.getItem('ticketsHistory')) || [];
            const ticket = tickets.find(t => t.id == ticketId);
            
            if (!ticket) {
                document.getElementById('ticket-detail').innerHTML = `
                    <div style="text-align: center; padding: 40px;">
                        <h3>Ticket non trouvé</h3>
                        <p>Le ticket demandé n'existe pas ou a été supprimé</p>
                        <button onclick="window.history.back()" class="btn btn-primary">
                            <i class="fas fa-arrow-left"></i> Retour à l'historique
                        </button>
                    </div>
                `;
                return;
            }

            // Formater les dates
            const visitDate = new Date(ticket.dateVisite);
            const formattedVisitDate = visitDate.toLocaleDateString('fr-FR', {
                weekday: 'long',
                day: '2-digit',
                month: 'long',
                year: 'numeric'
            });
            
            const createdDate = new Date(ticket.dateCreation || Date.now());
            const formattedCreatedDate = createdDate.toLocaleDateString('fr-FR', {
                day: '2-digit',
                month: '2-digit',
                year: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            });

            // Calculer le total des attractions
            const totalAttractions = ticket.panier 
                ? ticket.panier.reduce((sum, item) => sum + (item.price * item.quantity), 0)
                : 0;

            // Générer le contenu HTML
            document.getElementById('ticket-detail').innerHTML = `
                <div class="ticket-header">
                    <h2 class="ticket-title">Parc Magique - Ticket de visite</h2>
                    <div class="ticket-ref">Référence : ${ticket.reference || 'TKT-' + ticket.id.toString().slice(-6)}</div>
                </div>
                
                <div class="ticket-body">
                    <div>
                        <div class="ticket-section">
                            <h3 class="section-title"><i class="fas fa-user"></i> Informations client</h3>
                            <div class="detail-row">
                                <span class="detail-label">Nom :</span>
                                <span class="detail-value">${ticket.nom || 'Non spécifié'}</span>
                            </div>
                            <div class="detail-row">
                                <span class="detail-label">Téléphone :</span>
                                <span class="detail-value">${ticket.telephone || 'Non spécifié'}</span>
                            </div>
                        </div>
                        
                        <div class="ticket-section">
                            <h3 class="section-title"><i class="fas fa-calendar-alt"></i> Informations visite</h3>
                            <div class="detail-row">
                                <span class="detail-label">Date de visite :</span>
                                <span class="detail-value">${formattedVisitDate}</span>
                            </div>
                            <div class="detail-row">
                                <span class="detail-label">Date d'émission :</span>
                                <span class="detail-value">${formattedCreatedDate}</span>
                            </div>
                            <div class="detail-row">
                                <span class="detail-label">Statut :</span>
                                <span class="detail-value" style="font-weight: bold; color: ${ticket.statusPaiement === 'Payé' ? 'green' : 'orange'}">
                                    ${ticket.statusPaiement || 'À payer'}
                                </span>
                            </div>
                        </div>
                    </div>
                    
                    <div>
                        <div class="ticket-section">
                            <h3 class="section-title"><i class="fas fa-ticket-alt"></i> Détails des attractions</h3>
                            <ul class="attractions-list">
                                ${ticket.panier ? ticket.panier.map(item => `
                                    <li class="attraction-item">
                                        <span>${item.name} × ${item.quantity}</span>
                                        <span>${(item.price * item.quantity).toFixed(2)} DA</span>
                                    </li>
                                `).join('') : '<li>Aucune attraction</li>'}
                            </ul>
                        </div>
                        
                        <div class="ticket-section">
                            <h3 class="section-title"><i class="fas fa-money-bill-wave"></i> Paiement</h3>
                            <div class="detail-row">
                                <span class="detail-label">Total attractions :</span>
                                <span class="detail-value">${totalAttractions.toFixed(2)} DA</span>
                            </div>
                            <div class="detail-row">
                                <span class="detail-label">Mode de paiement :</span>
                                <span class="detail-value">
                                    ${ticket.modePaiement === 'en_ligne' ? 
                                      '<i class="fas fa-credit-card"></i> Carte bancaire' : 
                                      '<i class="fas fa-money-bill-wave"></i> Espèces'}
                                    ${ticket.last4Digits ? '(•••• ' + ticket.last4Digits + ')' : ''}
                                </span>
                            </div>
                        </div>
                    </div>
                </div>
                
                <div class="ticket-footer">
                    <p>Merci pour votre visite au Parc Magique !</p>
                    <p>Présentez ce ticket à l'entrée du parc.</p>
                </div>
                
                <div class="action-buttons">
                    <button onclick="window.print()" class="btn btn-primary">
                        <i class="fas fa-print"></i> Imprimer
                    </button>
                    <button onclick="window.history.back()" class="btn btn-secondary">
                        <i class="fas fa-arrow-left"></i> Retour
                    </button>
                </div>
            `;
        });
    </script>
</body>
</html>
